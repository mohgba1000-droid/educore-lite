<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduCore Lite — Student Management</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;
    background:#F1F8F1;color:#1B2A1B;font-size:14px;line-height:1.5;
  }
  /* Header */
  .header{
    background:#2E7D32;height:64px;display:flex;align-items:center;
    justify-content:space-between;padding:0 24px;color:#fff;
  }
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
  .logo svg{width:24px;height:24px}
  .page-label{font-size:14px;opacity:.95}
  /* Container */
  .container{max-width:1100px;margin:0 auto;padding:24px}
  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .stat{
    background:#fff;border-radius:12px;padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:4px solid #2E7D32;
  }
  .stat-num{font-size:32px;font-weight:700;color:#2E7D32;line-height:1}
  .stat-label{font-size:13px;color:#4A6741;margin-top:8px}
  /* Card */
  .card{
    background:#fff;border-radius:12px;padding:24px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:24px;
  }
  .card-title{font-size:18px;font-weight:600;color:#2E7D32;margin:0 0 20px}
  /* Form */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:#4A6741;margin-bottom:6px}
  .field input,.field select{
    width:100%;height:44px;padding:0 12px;font-size:14px;
    border:1px solid #C8E6C9;border-radius:8px;background:#fff;color:#1B2A1B;
    font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:none;border-color:#2E7D32;box-shadow:0 0 0 3px rgba(46,125,50,.15)}
  .field.error input,.field.error select{border-color:#C62828}
  .err-msg{display:none;color:#C62828;font-size:12px;margin-top:4px}
  .field.error .err-msg{display:block}
  .form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
  .btn{
    height:44px;padding:0 20px;border-radius:8px;font-size:14px;font-weight:600;
    cursor:pointer;border:none;font-family:inherit;transition:all .15s;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-primary{background:#2E7D32;color:#fff;min-width:160px}
  .btn-primary:hover{background:#1B5E20;box-shadow:0 4px 12px rgba(46,125,50,.3)}
  .btn-secondary{background:#fff;color:#4A6741;border:1px solid #C8E6C9;min-width:120px}
  .btn-secondary:hover{background:#F1F8F1}
  .btn-danger{background:#C62828;color:#fff;min-width:140px}
  .btn-danger:hover{background:#8E1B1B;box-shadow:0 4px 12px rgba(198,40,40,.3)}
  /* Banner */
  .banner{
    display:none;padding:12px 16px;border-radius:8px;margin-bottom:16px;
    background:#E8F5E9;border:1px solid #A5D6A7;color:#1B5E20;font-weight:600;
  }
  .banner.show{display:block;animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  /* Toolbar */
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    margin-bottom:16px;flex-wrap:wrap;
  }
  .search-wrap{position:relative;width:280px;max-width:100%}
  .search-wrap input{
    width:100%;height:44px;padding:0 36px 0 38px;border:1px solid #C8E6C9;
    border-radius:8px;font-size:14px;font-family:inherit;
  }
  .search-wrap input:focus{outline:none;border-color:#2E7D32}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#4A6741}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border:none;background:#F1F8F1;border-radius:50%;
    cursor:pointer;display:none;align-items:center;justify-content:center;color:#4A6741;
  }
  .search-clear.show{display:flex}
  .count-label{font-size:13px;color:#4A6741}
  /* Table */
  .table-wrap{overflow-x:auto;border-radius:8px;border:1px solid #C8E6C9}
  table{width:100%;border-collapse:collapse;min-width:720px}
  thead th{
    background:#2E7D32;color:#fff;font-size:13px;font-weight:700;text-transform:uppercase;
    text-align:left;padding:14px 12px;position:sticky;top:0;
  }
  th.center,td.center{text-align:center}
  tbody td{padding:12px;border-bottom:1px solid #E8F5E9;font-size:14px;height:48px}
  tbody tr:nth-child(odd){background:#fff}
  tbody tr:nth-child(even){background:#F9FBF9}
  tbody tr:hover{background:#E8F5E9;cursor:pointer}
  tbody tr:last-child td{border-bottom:none}
  /* Pills */
  .pill{
    display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;
  }
  .pill-paid{background:#E8F5E9;color:#1B5E20}
  .pill-owing{background:#FFEBEE;color:#C62828}
  .pill-partial{background:#FFF8E1;color:#F57F17}
  /* Action buttons */
  .actions{display:flex;gap:8px;justify-content:center}
  .icon-btn{
    width:36px;height:36px;border:none;background:transparent;border-radius:6px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:#E8F5E9}
  .icon-edit{color:#2E7D32}
  .icon-delete{color:#C62828}
  /* Empty state */
  .empty{padding:48px 16px;text-align:center;color:#4A6741}
  .empty svg{width:56px;height:56px;opacity:.5;margin-bottom:12px}
  .empty h3{margin:0 0 6px;font-size:16px;color:#4A6741}
  .empty p{margin:0;font-size:13px}
  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
    align-items:center;justify-content:center;z-index:100;padding:16px;
  }
  .overlay.show{display:flex}
  .modal{
    background:#fff;border-radius:12px;width:480px;max-width:100%;
    box-shadow:0 8px 32px rgba(0,0,0,.2);overflow:hidden;
  }
  .modal-header{
    padding:20px 24px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid #E8F5E9;
  }
  .modal-header h3{margin:0;font-size:18px;font-weight:700;color:#1B2A1B}
  .modal-close{
    background:none;border:none;font-size:24px;cursor:pointer;color:#4A6741;
    width:32px;height:32px;border-radius:6px;
  }
  .modal-close:hover{background:#F1F8F1}
  .modal-body{padding:24px}
  .modal-body .form-grid{grid-template-columns:1fr}
  .modal-footer{padding:16px 24px;display:flex;justify-content:flex-end;gap:12px;background:#F9FBF9}
  /* Confirm modal */
  .confirm-body{padding:32px 24px;text-align:center}
  .confirm-body .warn{
    width:64px;height:64px;border-radius:50%;background:#FFEBEE;color:#C62828;
    display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;
  }
  .confirm-body h3{margin:0 0 8px;font-size:18px;color:#1B2A1B}
  .confirm-body p{margin:0;color:#4A6741;font-size:14px}
  /* Toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1B5E20;color:#fff;padding:12px 20px;border-radius:8px;font-weight:600;
    font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;pointer-events:none;
    transition:all .25s;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* Mobile */
  @media (max-width:768px){
    .container{padding:16px}
    .header{padding:0 16px}
    .stats{grid-template-columns:1fr 1fr}
    .form-grid{grid-template-columns:1fr}
    .form-actions{flex-direction:column-reverse}
    .form-actions .btn{width:100%}
    .search-wrap{width:100%}
    .toolbar{flex-direction:column;align-items:stretch}
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17z"/></svg>
    EduCore Lite
  </div>
  <div class="page-label">Student Management</div>
</header>

<main class="container">

  <!-- Stats -->
  <section class="stats">
    <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total Students</div></div>
    <div class="stat"><div class="stat-num" id="stat-paid">0</div><div class="stat-label">Paid</div></div>
    <div class="stat"><div class="stat-num" id="stat-owing">0</div><div class="stat-label">Owing</div></div>
    <div class="stat"><div class="stat-num" id="stat-partial">0</div><div class="stat-label">Partial</div></div>
  </section>

  <!-- Add form -->
  <section class="card">
    <h2 class="card-title">Add New Student</h2>
    <div id="addBanner" class="banner">✓ Student added successfully</div>
    <form id="addForm" novalidate>
      <div class="form-grid">
        <div class="field" data-field="name">
          <label for="f-name">Full Name</label>
          <input id="f-name" type="text" placeholder="e.g. Amara Okafor" />
          <div class="err-msg"></div>
        </div>
        <div class="field" data-field="className">
          <label for="f-class">Class</label>
          <select id="f-class">
            <option value="" disabled selected>— Select Class —</option>
            <option>Primary 1</option><option>Primary 2</option><option>Primary 3</option>
            <option>Primary 4</option><option>Primary 5</option><option>Primary 6</option>
          </select>
          <div class="err-msg"></div>
        </div>
        <div class="field" data-field="parentPhone">
          <label for="f-phone">Parent Phone Number</label>
          <input id="f-phone" type="tel" placeholder="e.g. 08012345678" maxlength="11" />
          <div class="err-msg"></div>
        </div>
        <div class="field" data-field="feeStatus">
          <label for="f-fee">Fee Status</label>
          <select id="f-fee">
            <option value="" disabled selected>— Select Status —</option>
            <option value="Paid">● Paid</option>
            <option value="Owing">● Owing</option>
            <option value="Partial">● Partial</option>
          </select>
          <div class="err-msg"></div>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="clearBtn">Clear Form</button>
        <button type="submit" class="btn btn-primary">Add Student</button>
      </div>
    </form>
  </section>

  <!-- List -->
  <section class="card">
    <h2 class="card-title">Student List</h2>
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input id="searchInput" type="text" placeholder="Search by name or class..." />
        <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">×</button>
      </div>
      <div class="count-label" id="countLabel">Showing 0 of 0 students</div>
    </div>
    <div id="tableArea"></div>
  </section>

</main>

<!-- Edit modal -->
<div class="overlay" id="editOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3>Edit Student Details</h3>
      <button class="modal-close" data-close="edit">×</button>
    </div>
    <div class="modal-body">
      <form id="editForm" novalidate>
        <div class="form-grid">
          <div class="field" data-field="name">
            <label for="e-name">Full Name</label>
            <input id="e-name" type="text" />
            <div class="err-msg"></div>
          </div>
          <div class="field" data-field="className">
            <label for="e-class">Class</label>
            <select id="e-class">
              <option value="" disabled>— Select Class —</option>
              <option>Primary 1</option><option>Primary 2</option><option>Primary 3</option>
              <option>Primary 4</option><option>Primary 5</option><option>Primary 6</option>
            </select>
            <div class="err-msg"></div>
          </div>
          <div class="field" data-field="parentPhone">
            <label for="e-phone">Parent Phone Number</label>
            <input id="e-phone" type="tel" maxlength="11" />
            <div class="err-msg"></div>
          </div>
          <div class="field" data-field="feeStatus">
            <label for="e-fee">Fee Status</label>
            <select id="e-fee">
              <option value="" disabled>— Select Status —</option>
              <option value="Paid">● Paid</option>
              <option value="Owing">● Owing</option>
              <option value="Partial">● Partial</option>
            </select>
            <div class="err-msg"></div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close="edit">Cancel</button>
      <button class="btn btn-primary" id="saveEditBtn">Save Changes</button>
    </div>
  </div>
</div>

<!-- Confirm delete modal -->
<div class="overlay" id="confirmOverlay">
  <div class="modal" role="dialog" aria-modal="true" style="width:420px">
    <div class="confirm-body">
      <div class="warn">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      </div>
      <h3>Delete Student?</h3>
      <p id="confirmText">Are you sure?</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close="confirm">Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">Yes, Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // ---------- Data ----------
  let nextId = 1;
  const students = [
    {id:nextId++, name:"Amara Okafor",     className:"Primary 4", parentPhone:"08012345678", feeStatus:"Paid"},
    {id:nextId++, name:"Emeka Nwosu",      className:"Primary 2", parentPhone:"08098765432", feeStatus:"Owing"},
    {id:nextId++, name:"Fatima Aliyu",     className:"Primary 5", parentPhone:"08055544433", feeStatus:"Partial"},
    {id:nextId++, name:"Chidi Eze",        className:"Primary 1", parentPhone:"08077788899", feeStatus:"Paid"},
    {id:nextId++, name:"Blessing Adeyemi", className:"Primary 6", parentPhone:"08033322211", feeStatus:"Owing"},
  ];

  let currentSearch = "";
  let editingId = null;
  let pendingDeleteId = null;

  // ---------- Utils ----------
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function showToast(msg){
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  // ---------- Validation ----------
  function validateFields(f){
    const errors = {};
    const name = (f.name||"").trim();
    if(!name) errors.name = "Please enter a valid full name (letters only, 3–60 characters)";
    else if(!/^[A-Za-z\s]{3,60}$/.test(name)) errors.name = "Please enter a valid full name (letters only, 3–60 characters)";

    if(!f.className) errors.className = "Please select a class";

    const phone = (f.parentPhone||"").trim();
    if(!/^0\d{10}$/.test(phone)) errors.parentPhone = "Please enter a valid 11-digit Nigerian phone number starting with 0";

    if(!f.feeStatus) errors.feeStatus = "Please select a fee status";

    return {valid: Object.keys(errors).length===0, errors};
  }

  function applyErrors(formEl, errors){
    formEl.querySelectorAll(".field").forEach(el=>{
      const key = el.dataset.field;
      const msg = errors[key];
      el.classList.toggle("error", !!msg);
      el.querySelector(".err-msg").textContent = msg || "";
    });
    const firstErr = formEl.querySelector(".field.error");
    if(firstErr) firstErr.scrollIntoView({behavior:"smooth", block:"center"});
  }

  function clearErrors(formEl){
    formEl.querySelectorAll(".field").forEach(el=>{
      el.classList.remove("error");
      el.querySelector(".err-msg").textContent = "";
    });
  }

  // ---------- Stats ----------
  function updateStats(){
    $("#stat-total").textContent = students.length;
    $("#stat-paid").textContent = students.filter(s=>s.feeStatus==="Paid").length;
    $("#stat-owing").textContent = students.filter(s=>s.feeStatus==="Owing").length;
    $("#stat-partial").textContent = students.filter(s=>s.feeStatus==="Partial").length;
  }

  // ---------- Render ----------
  function pillFor(status){
    const cls = status==="Paid"?"pill-paid":status==="Owing"?"pill-owing":"pill-partial";
    return `<span class="pill ${cls}">${status}</span>`;
  }

  function renderTable(data){
    const list = data || (currentSearch ? searchFilter(currentSearch) : students);
    const area = $("#tableArea");
    $("#countLabel").textContent = `Showing ${list.length} of ${students.length} students`;

    if(students.length === 0){
      area.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/></svg>
          <h3>No students added yet</h3>
          <p>Use the form above to add your first student</p>
        </div>`;
      return;
    }
    if(list.length === 0){
      area.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8 8l6 6M14 8l-6 6"/></svg>
          <h3>No students match your search</h3>
          <p>Try searching by a different name or class</p>
        </div>`;
      return;
    }

    const rows = list.map((s,i)=>`
      <tr data-id="${s.id}">
        <td class="center">${i+1}</td>
        <td>${esc(s.name)}</td>
        <td class="center">${esc(s.className)}</td>
        <td class="center">${esc(s.parentPhone)}</td>
        <td class="center">${pillFor(s.feeStatus)}</td>
        <td class="center">
          <div class="actions">
            <button class="icon-btn icon-edit" title="Edit" data-action="edit" data-id="${s.id}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <button class="icon-btn icon-delete" title="Delete" data-action="delete" data-id="${s.id}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </td>
      </tr>`).join("");

    area.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="center" style="width:48px">#</th>
            <th>Student Name</th>
            <th class="center" style="width:120px">Class</th>
            <th class="center" style="width:160px">Parent Contact</th>
            <th class="center" style="width:120px">Fee Status</th>
            <th class="center" style="width:100px">Actions</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function searchFilter(q){
    q = q.trim().toLowerCase();
    if(!q) return students;
    return students.filter(s =>
      s.name.toLowerCase().includes(q) || s.className.toLowerCase().includes(q)
    );
  }

  // ---------- CRUD ----------
  function addStudent(data){
    students.push({id:nextId++, ...data});
    renderTable();
    updateStats();
  }
  function editStudent(id, data){
    const s = students.find(x=>x.id===id);
    if(!s) return;
    Object.assign(s, data);
    renderTable();
    updateStats();
  }
  function deleteStudent(id){
    const idx = students.findIndex(x=>x.id===id);
    if(idx>-1) students.splice(idx,1);
    renderTable();
    updateStats();
  }

  // ---------- Add form ----------
  const addForm = $("#addForm");
  addForm.addEventListener("submit", e=>{
    e.preventDefault();
    const data = {
      name: $("#f-name").value,
      className: $("#f-class").value,
      parentPhone: $("#f-phone").value,
      feeStatus: $("#f-fee").value,
    };
    const v = validateFields(data);
    if(!v.valid){ applyErrors(addForm, v.errors); return; }
    clearErrors(addForm);
    addStudent({name:data.name.trim(), className:data.className, parentPhone:data.parentPhone.trim(), feeStatus:data.feeStatus});
    addForm.reset();
    const banner = $("#addBanner");
    banner.classList.add("show");
    clearTimeout(banner._h);
    banner._h = setTimeout(()=>banner.classList.remove("show"), 3000);
  });
  $("#clearBtn").addEventListener("click", ()=>{
    addForm.reset();
    clearErrors(addForm);
  });
  // Phone digits only
  $("#f-phone").addEventListener("input", e=>{
    e.target.value = e.target.value.replace(/\D/g,"").slice(0,11);
  });

  // ---------- Search ----------
  const searchInput = $("#searchInput");
  const searchClear = $("#searchClear");
  searchInput.addEventListener("input", e=>{
    currentSearch = e.target.value;
    searchClear.classList.toggle("show", !!currentSearch);
    renderTable();
  });
  searchClear.addEventListener("click", ()=>{
    searchInput.value = "";
    currentSearch = "";
    searchClear.classList.remove("show");
    renderTable();
    searchInput.focus();
  });

  // ---------- Table actions ----------
  $("#tableArea").addEventListener("click", e=>{
    const btn = e.target.closest("button[data-action]");
    if(!btn) return;
    const id = Number(btn.dataset.id);
    if(btn.dataset.action === "edit") openEdit(id);
    else if(btn.dataset.action === "delete") openConfirm(id);
  });

  // ---------- Edit modal ----------
  const editOverlay = $("#editOverlay");
  const editForm = $("#editForm");
  function openEdit(id){
    const s = students.find(x=>x.id===id);
    if(!s) return;
    editingId = id;
    $("#e-name").value = s.name;
    $("#e-class").value = s.className;
    $("#e-phone").value = s.parentPhone;
    $("#e-fee").value = s.feeStatus;
    clearErrors(editForm);
    editOverlay.classList.add("show");
  }
  function closeEdit(){ editOverlay.classList.remove("show"); editingId = null; }
  $("#e-phone").addEventListener("input", e=>{
    e.target.value = e.target.value.replace(/\D/g,"").slice(0,11);
  });
  $("#saveEditBtn").addEventListener("click", ()=>{
    const data = {
      name: $("#e-name").value,
      className: $("#e-class").value,
      parentPhone: $("#e-phone").value,
      feeStatus: $("#e-fee").value,
    };
    const v = validateFields(data);
    if(!v.valid){ applyErrors(editForm, v.errors); return; }
    editStudent(editingId, {name:data.name.trim(), className:data.className, parentPhone:data.parentPhone.trim(), feeStatus:data.feeStatus});
    closeEdit();
    showToast("Changes saved");
  });

  // ---------- Confirm delete ----------
  const confirmOverlay = $("#confirmOverlay");
  function openConfirm(id){
    const s = students.find(x=>x.id===id);
    if(!s) return;
    pendingDeleteId = id;
    $("#confirmText").innerHTML = `Are you sure you want to remove <strong>${esc(s.name)}</strong> from the list? This cannot be undone.`;
    confirmOverlay.classList.add("show");
  }
  function closeConfirm(){ confirmOverlay.classList.remove("show"); pendingDeleteId = null; }
  $("#confirmDeleteBtn").addEventListener("click", ()=>{
    if(pendingDeleteId!=null){
      deleteStudent(pendingDeleteId);
      closeConfirm();
      showToast("Student removed");
    }
  });

  // ---------- Modal close handlers ----------
  document.querySelectorAll("[data-close]").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(b.dataset.close==="edit") closeEdit();
      else if(b.dataset.close==="confirm") closeConfirm();
    });
  });
  [editOverlay, confirmOverlay].forEach(ov=>{
    ov.addEventListener("click", e=>{
      if(e.target===ov){
        if(ov===editOverlay) closeEdit(); else closeConfirm();
      }
    });
  });
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ closeEdit(); closeConfirm(); }
  });

  // ---------- Init ----------
  renderTable();
  updateStats();
})();
</script>
</body>
</html>
